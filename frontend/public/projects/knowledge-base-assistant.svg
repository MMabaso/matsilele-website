<text x="848" y="218" font-size="21" fill="#ffffff" font-weight="500" text-anchor="start">What checks are needed before restarting the</text>
<text x="848" y="250" font-size="21" fill="#ffffff" font-weight="500" text-anchor="start">cold mill after a work roll change?</text>
<circle cx="518" cy="328" r="22" fill="#e3f1ed"/>
<path d="M508,320 h20 a3,3 0 0 1 3,3 v10 a3,3 0 0 1 -3,3 h-11 l-6,5 v-5 h-3 a3,3 0 0 1 -3,-3 v-10 a3,3 0 0 1 3,-3 z" fill="#0f6b5c"/>
<rect x="556" y="300" width="900" height="380" rx="20" fill="#f7f6f2" stroke="#e7e5e1" stroke-width="2"/>
<text x="588" y="344" font-size="21" fill="#16181d" font-weight="600" text-anchor="start">Before restarting after a work roll change:</text>
<text x="588" y="398" font-size="20" fill="#0f6b5c" font-weight="700" text-anchor="start">1.</text>
<text x="620" y="398" font-size="20" fill="#16181d" font-weight="400" text-anchor="start">Confirm the lock-out is released by the authorised person.</text>
<rect x="1398" y="380" width="26" height="24" rx="6" fill="#e3f1ed"/>
<text x="1411" y="398" font-size="15" fill="#0f6b5c" font-weight="700" text-anchor="middle">1</text>
<text x="588" y="450" font-size="20" fill="#0f6b5c" font-weight="700" text-anchor="start">2.</text>
<text x="620" y="450" font-size="20" fill="#16181d" font-weight="400" text-anchor="start">Check roll gap and alignment against the set-up sheet.</text>
<rect x="1398" y="432" width="26" height="24" rx="6" fill="#e3f1ed"/>
<text x="1411" y="450" font-size="15" fill="#0f6b5c" font-weight="700" text-anchor="middle">1</text>
<text x="588" y="502" font-size="20" fill="#0f6b5c" font-weight="700" text-anchor="start">3.</text>
<text x="620" y="502" font-size="20" fill="#16181d" font-weight="400" text-anchor="start">Run at threading speed and verify coolant flow on both sides.</text>
<rect x="1398" y="484" width="26" height="24" rx="6" fill="#e3f1ed"/>
<text x="1411" y="502" font-size="15" fill="#0f6b5c" font-weight="700" text-anchor="middle">2</text>
<text x="588" y="554" font-size="20" fill="#0f6b5c" font-weight="700" text-anchor="start">4.</text>
<text x="620" y="554" font-size="20" fill="#16181d" font-weight="400" text-anchor="start">Inspect the first coil for surface marks before full speed.</text>
<rect x="1398" y="536" width="26" height="24" rx="6" fill="#e3f1ed"/>
<text x="1411" y="554" font-size="15" fill="#0f6b5c" font-weight="700" text-anchor="middle">2</text>
<text x="588" y="606" font-size="20" fill="#0f6b5c" font-weight="700" text-anchor="start">5.</text>
<text x="620" y="606" font-size="20" fill="#16181d" font-weight="400" text-anchor="start">Record the change and roll numbers in the shift log.</text>
<rect x="1398" y="588" width="26" height="24" rx="6" fill="#e3f1ed"/>
<text x="1411" y="606" font-size="15" fill="#0f6b5c" font-weight="700" text-anchor="middle">3</text>
<text x="588" y="656" font-size="17" fill="#5b6270" font-weight="400" text-anchor="start">Answers are grounded in your documents, with sources below.</text>
