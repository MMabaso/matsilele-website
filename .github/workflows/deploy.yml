# Deploy: every push to main runs CI, then builds the image, pushes it to Azure Container Registry
# and rolls it out to Azure Container Apps. Can also be started by hand from the Actions tab.
#
# One-time setup (see README → "GitHub Actions"):
#   Repository variables:  AZURE_RESOURCE_GROUP, ACR_NAME, CONTAINER_APP_NAME
#   Repository secrets:    AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   (OIDC, no passwords)
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub sign in to Azure with OIDC

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deployment half-way

env:
  IMAGE_NAME: matsilele-website

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and deploy
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          for v in RESOURCE_GROUP ACR_NAME APP_NAME; do
            [ -z "$(eval echo \$$v)" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Sign in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Check the live site
        run: |
          FQDN=$(az containerapp show --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" \
                   --query properties.configuration.ingress.fqdn -o tsv)
          echo "Checking https://$FQDN"
          for i in $(seq 1 30); do
            curl -fsS "https://$FQDN/healthz" >/dev/null && break
            sleep 5
          done
          curl -fsS "https://$FQDN/healthz"
          curl -fsS "https://$FQDN/api/posts/?limit=1" >/dev/null
          echo "### Deployed ${GITHUB_SHA::7} to https://$FQDN" >> "$GITHUB_STEP_SUMMARY"
