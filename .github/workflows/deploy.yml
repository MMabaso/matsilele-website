# Deploy: every push to main runs CI, then builds the image, pushes it to Google Artifact Registry
# and rolls it out to Cloud Run. Can also be started by hand from the Actions tab.
#
# One-time setup (see README → "GitHub Actions"): run scripts/setup-github-deploy.sh, then add the
# repository variables it prints: GCP_PROJECT_ID, GCP_REGION, CLOUD_RUN_SERVICE, GCP_WORKLOAD_IDENTITY_PROVIDER,
# GCP_DEPLOY_SERVICE_ACCOUNT. Sign-in uses Workload Identity Federation (OIDC): no keys or passwords stored.
#
# This only swaps the container image. The service's settings and secrets (DATABASE_URL, OPENAI_API_KEY, ...)
# stay as configured on Cloud Run, so change those with `gcloud run services update`, not here.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub sign in to Google Cloud with OIDC

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deployment half-way

jobs:
  checks:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, push and deploy
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/website/site
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_DEPLOY_SERVICE_ACCOUNT; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (Settings → Secrets and variables → Actions → Variables)"
            exit 1
          fi

      - name: Sign in to Google Cloud (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sign in to Artifact Registry
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE:${{ github.sha }}" \
            --quiet

      # Not /healthz: Cloud Run reserves paths ending in "z" and answers them itself.
      - name: Check the live site
        run: |
          URL=$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" \
                  --format='value(status.url)')
          echo "Checking $URL"
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "$URL/" && break
            sleep 5
          done
          curl -fsS -o /dev/null "$URL/"
          curl -fsS -o /dev/null "$URL/api/posts/?limit=1"
          echo "### Deployed ${GITHUB_SHA::7} to $URL" >> "$GITHUB_STEP_SUMMARY"
