# CI: runs on every pull request and every push to a branch other than main.
# deploy.yml calls this same workflow first, so main is never deployed without passing these checks.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret
      RAG_BUILD_ON_START: "False"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python src/manage.py check

      - name: No missing migrations
        run: python src/manage.py makemigrations --check --dry-run

      - name: Run tests (LLM and embeddings are mocked; no API key needed)
        run: python src/manage.py test core

  frontend:
    name: Frontend build (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build

  docker:
    name: Docker image builds and starts
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: matsilele-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name site -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-only-secret \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e SEED_POSTS=true \
            matsilele-website:ci

          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz >/dev/null && break
            sleep 2
          done

          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/about | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/api/posts/ | grep -q 'Forward Deployed'
          curl -fsS -o /dev/null http://localhost:8000/admin/login/
          echo "Container serves the site, API and admin."

      - name: Container logs
        if: always()
        run: docker logs site || true
